name: Release

# 发布新 Release 后自动打包：构建自解压安装程序（exe）与唯一发布包，
# 并作为资产上传到该 Release。
on:
  release:
    types: [published]

permissions:
  contents: write   # 上传 Release 资产需要

jobs:
  package:
    name: 打包并上传发布包
    runs-on: windows-latest   # 打 exe 需要 Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包工具
        run: python -m pip install --upgrade pip pyinstaller

      - name: 自检交付物
        run: python installer/validate_pack.py

      - name: 构建安装程序与发布包
        run: python installer/build_installer.py

      - name: 上传安装程序到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/Install-ZhCN.exe
          fail_on_unmatched_files: true
